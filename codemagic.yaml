# TakviMed — Codemagic iOS build yapılandırması
# ------------------------------------------------------------------
# Bu dosya, Codemagic'in bulut Mac'inde TakviMed iOS uygulamasını nasıl
# derleyeceğini ve TestFlight'a nasıl yükleyeceğini tanımlar.
#
# Codemagic UI'da yapılması gerekenler (kod değil, panel ayarı):
#   1. App Store Connect API anahtarını bir "integration" olarak ekle
#      ve adını AŞAĞIDAKİ ile birebir aynı yap: "TakviMed ASC Key"
#   2. "takvimed_firebase" adında bir değişken grubu (group) oluştur ve
#      içine .env dosyandaki VITE_FIREBASE_* değerlerini gir.
# ------------------------------------------------------------------

workflows:
  ios-testflight:
    name: TakviMed iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Bu ad, Codemagic UI'da oluşturacağın API anahtarı entegrasyonunun adıyla AYNI olmalı.
      app_store_connect: TakviMed ASC Key

    environment:
      ios_signing:
        # Codemagic, API anahtarını kullanarak imzalama dosyalarını otomatik üretir/çeker.
        distribution_type: app_store
        bundle_identifier: com.takvimed.app
      groups:
        # Firebase ortam değişkenleri — Codemagic UI'da bu grubu oluşturup doldur.
        - takvimed_firebase
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest

    scripts:
      - name: npm bağımlılıklarını kur
        script: npm ci

      - name: .env dosyasını oluştur
        script: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          EOF

      - name: Web uygulamasını derle (Vite)
        script: npm run build

      - name: Capacitor iOS senkron
        script: npx cap sync ios

      - name: Build numarasını ayarla
        script: |
          # TestFlight her yüklemede artan, benzersiz bir build numarası ister.
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: İmza profillerini uygula
        script: xcode-project use-profiles

      - name: IPA oluştur
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Build'i otomatik olarak TestFlight'a yükler (internal test için hazır olur).
        submit_to_testflight: true
